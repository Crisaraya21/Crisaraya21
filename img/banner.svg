<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Cristopher Araya Vega - Ingeniero en Ciencias de la Computaci&#243;n en formaci&#243;n">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F1E46"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#93C5FD"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1.2" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.2" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1500" height="500" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="typing"><rect class="typer" x="520" y="250" width="0" height="60"/></clipPath>
    <clipPath id="frame"><rect width="1500" height="500" rx="28"/></clipPath>
  </defs>

  <style>
    .orb1 { animation: float1 14s ease-in-out infinite; }
    .orb2 { animation: float2 18s ease-in-out infinite; }
    .orb3 { animation: float3 16s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(120px,60px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-140px,-50px); } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-80px); } }

    .ring1 { transform-origin: 300px 250px; animation: spin 22s linear infinite; }
    .ring2 { transform-origin: 300px 250px; animation: spin 30s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse { transform-origin: 300px 250px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.12); opacity: .9; } }

    .icon { transform-origin: 300px 250px; animation: pop 0.9s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .in1 { animation: rise .8s ease-out .3s both; }
    .in2 { animation: rise .8s ease-out .6s both; }
    .in4 { animation: rise .8s ease-out 4.6s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .typer { animation: type 3.4s steps(53, end) 1.1s forwards; }
    @keyframes type { to { width: 856px; } }
    .cursor { animation: move 3.4s steps(53, end) 1.1s forwards, blink 1s step-end infinite; }
    @keyframes move { to { transform: translateX(848px); } }
    @keyframes blink { 50% { opacity: 0; } }

    .bar { transform-origin: 524px 330px; animation: grow 1s ease-out 4.4s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1500" height="500" fill="url(#bg)"/>

    <!-- Luces difusas en movimiento -->
    <g filter="url(#blur)" opacity="0.75">
      <circle class="orb1" cx="250" cy="120" r="170" fill="#2563EB"/>
      <circle class="orb2" cx="1250" cy="400" r="200" fill="#0891B2"/>
      <circle class="orb3" cx="900" cy="60" r="140" fill="#4F46E5"/>
    </g>

    <!-- Cuadricula sutil -->
    <rect width="1500" height="500" fill="url(#grid)" opacity="0.07" mask="url(#gridMask)"/>

    <!-- Icono central con orbitas -->
    <circle class="pulse" cx="300" cy="250" r="150" fill="url(#core)" filter="url(#glow)" opacity="0.6"/>
    <g class="ring1">
      <circle cx="300" cy="250" r="175" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 14"/>
      <circle cx="475" cy="250" r="7" fill="#22D3EE"/>
    </g>
    <g class="ring2">
      <circle cx="300" cy="250" r="205" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 10"/>
      <circle cx="300" cy="45" r="5" fill="#A5B4FC"/>
    </g>
    <g class="icon">
      <circle cx="300" cy="250" r="128" fill="url(#core)"/>
      <circle cx="300" cy="250" r="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
      <path d="M262 205 L218 250 L262 295" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M338 205 L382 250 L338 295" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M314 190 L286 310" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Textos -->
    <text class="sans in1" x="524" y="132" font-size="22" font-weight="600" letter-spacing="6" fill="#67E8F9">HOLA, SOY</text>
    <text class="sans in2" x="520" y="214" font-size="76" font-weight="800" fill="url(#shine)">Cristopher Araya Vega</text>

    <g clip-path="url(#typing)">
      <text class="mono" x="524" y="290" font-size="27" textLength="848" lengthAdjust="spacingAndGlyphs" fill="#DBEAFE">Ingeniero en Ciencias de la <tspan fill="#38BDF8" font-weight="700">Computaci&#243;n</tspan> en formaci&#243;n</text>
    </g>
    <rect class="cursor" x="526" y="264" width="3" height="32" fill="#38BDF8"/>

    <rect class="bar" x="524" y="326" width="140" height="4" rx="2" fill="url(#core)"/>
    <text class="sans in4" x="524" y="380" font-size="24" fill="#93C5FD">Tecnol&#243;gico de Costa Rica  &#183;  Cofundador de AS Software &amp; Automation</text>
  </g>
</svg>
